name: CI/CD

# CI = TESTS ONLY (lint, typecheck, unit, e2e w/ real Postgres). There is
# NO deploy step here: the old deploy job silently skipped when
# DEPLOY_SSH_* secrets were missing, so a green build could lie about
# being live (Oct 26 incident). Deploys are VM-side — docs/release-flow.md:
#   beta — systemd timer auto-deploys origin/main every 5 min
#   prod — scripts/deploy.sh --env prod --ref <v-tag> --approved-by "Joydip <date>"
#          (refuses to run without Joydip's explicit GO)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit

  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: e2e (playwright + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextbiz
          POSTGRES_PASSWORD: nextbiz
          POSTGRES_DB: nextbiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextbiz -d nextbiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 127.0.0.1, not localhost — GH runners resolve localhost to ::1 first
      # and the postgres service container is IPv4-only (connect would hang)
      DATABASE_URL: postgres://nextbiz:***@127.0.0.1:5432/nextbiz
      SLACK_WEBHOOK_URL: ""            # CI never pings Slack
      IP_HASH_SALT: ci-test-salt-only
      # S4 admin (e2e-only throwaway creds; prod creds live in VM .env only)
      ADMIN_USER: e2e-admin
      ADMIN_PASS: e2e-test-pass-2026
      SESSION_SECRET: ci-e2e-session-secret-0123456789abcdef
      NEXT_PUBLIC_WHATSAPP_NUMBER: "919088727191"
      # public marketing copy asserted by e2e — real values, not dummies
      NEXT_PUBLIC_WHATSAPP_PREFILL: "Hi NextBiz Studio — I'd like to talk about a project."
      NEXT_PUBLIC_CDN_BASE: "https://cdn.joyverse.fun"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply DB migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "  applying $f"
            # -i is load-bearing: without it docker exec drops stdin, psql
            # reads EOF and exits 0 — SQL never runs, table missing, tests
            # fail with no clue (bit us Oct 19). ON_ERROR_STOP makes any
            # SQL error fail the step loudly.
            docker exec -i ${{ job.services.postgres.id }} \
              psql -U nextbiz -d nextbiz -v ON_ERROR_STOP=1 -f - < "$f"
          done
      - run: npm run build
      - name: Start app
        run: |
          # repo builds with output:standalone (Docker prod) — "next start"
          # warns and misbehaves; run the standalone server like production does
          cp -r .next/static .next/standalone/.next/static
          # public/ is empty in this repo — not tracked by git, absent on a
          # fresh checkout; copy only if present
          [ -d public ] && cp -r public .next/standalone/public
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000 && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000 || { echo "app did not start"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
