name: CI/CD

# Quality gates (lint, typecheck, unit, e2e w/ real Postgres) → deploy on green.
# Tests red ⇒ deploy job never runs. Deploy script: scripts/deploy.sh (VM side).
# Secrets needed (Tony): DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY.
# Manual dispatch supported; deploys only track origin/main pushes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit

  unit:
    name: unit (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: e2e (playwright + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextbiz
          POSTGRES_PASSWORD: nextbiz
          POSTGRES_DB: nextbiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextbiz -d nextbiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nextbiz:nextbiz@localhost:5432/nextbiz
      SLACK_WEBHOOK_URL: ""            # CI never pings Slack
      IP_HASH_SALT: ci-test-salt-only
      NEXT_PUBLIC_BUSINESS_PHONE: "+910000000000"
      NEXT_PUBLIC_BUSINESS_EMAIL: "hello@example.com"
      NEXT_PUBLIC_WHATSAPP_NUMBER: "910000000000"
      NEXT_PUBLIC_WHATSAPP_PREFILL: "test"
      NEXT_PUBLIC_CDN_BASE: "https://cdn.joyverse.fun"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply DB migrations
        run: |
          for f in db/migrations/*.sql; do
            docker exec ${{ job.services.postgres.id }} psql -U nextbiz -d nextbiz -f /dev/stdin < "$f"
          done
      - run: npm run build
      - name: Start app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3000 || { echo "app did not start"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  deploy:
    name: deploy → VM (gated on all green)
    needs: [quality, unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH deploy + health gate
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            'bash -s' < scripts/deploy.sh
      - name: Post-deploy public verification
        run: |
          sleep 5
          for path in / /contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://nextbizstudio.com${path}")
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ] || { echo "DEPLOY HEALTH FAIL on ${path}"; exit 1; }
          done
          echo "✅ public site healthy after deploy"
